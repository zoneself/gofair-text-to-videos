// ---------- 字幕（自适应，蓝色关键词；置于顶部页眉位，避开抖音底部标题区） ----------
const CAPTION_TOP = 92;   // 顶部起始（状态栏下方）
const KW = /(GEO|SEO|AI|DeepSeek)/g;
function segOf(text) {
  const segs = []; let last = 0; let m; KW.lastIndex = 0;
  while ((m = KW.exec(text))) { if (m.index > last) segs.push({ t: text.slice(last, m.index), kw: false }); segs.push({ t: m[0], kw: true }); last = m.index + m[0].length; }
  if (last < text.length) segs.push({ t: text.slice(last), kw: false });
  return segs;
}
function splitClauses(text) {
  // 在标点后切分（标点留在句尾），用于按标点符号换行
  return text.split(/(?<=[，。！？、；：…—])/).filter((s) => s.length);
}
function layoutCaption(text, fontPx, maxW) {
  ctx.font = `900 ${fontPx}px ${SANS}`;
  const lines = []; let cur = []; let curW = 0;
  const newLine = () => { if (cur.length) lines.push(cur); cur = []; curW = 0; };
  const W = (s) => ctx.measureText(s).width;
  for (const clause of splitClauses(text)) {
    const segs = segOf(clause);
    const tw = segs.reduce((acc, sg) => acc + W(sg.t), 0);
    if (curW + tw <= maxW) {                      // 整个子句放得下：原样接上
      for (const sg of segs) { cur.push({ t: sg.t, kw: sg.kw, w: W(sg.t) }); curW += W(sg.t); }
      continue;
    }
    newLine();                                    // 放不下：整句移到下一行（标点处换行）
    if (tw <= maxW) {
      for (const sg of segs) { cur.push({ t: sg.t, kw: sg.kw, w: W(sg.t) }); curW += W(sg.t); }
      continue;
    }
    // 单个子句超行宽：逐字填充兜底（关键词不拆行）
    for (const sg of segs) {
      if (sg.kw) {
        if (curW + W(sg.t) > maxW) newLine();
        cur.push({ t: sg.t, kw: true, w: W(sg.t) }); curW += W(sg.t);
        continue;
      }
      let s = sg.t;
      while (s.length) {
        let n = 0, wAcc = 0;
        while (n < s.length) {
          const cw = W(s[n]);
          if (curW + wAcc + cw > maxW && (cur.length || n > 0)) break;
          wAcc += cw; n++;
        }
        if (n === 0) { newLine(); continue; }
        cur.push({ t: s.slice(0, n), kw: false, w: wAcc }); curW += wAcc;
        s = s.slice(n);
        if (s.length) newLine();
      }
    }
  }
  if (cur.length) lines.push(cur);
  return lines;
}
function drawCaption(t) {
  let c = null;
  for (const k of window.CAPTIONS) { if (t >= k.s && t < k.e) { c = k; break; } }
  if (!c) return;
  const u = t - c.s;
  const pop = u < 0.18 ? lerp(1.06, 1, E.outQuad(u / 0.18)) : 1;
  const slide = u < 0.18 ? (1 - E.outQuad(u / 0.18)) * 22 : 0;
  const maxW = 840;   // 行宽收窄：长句在标点处自然换成两行，不为单行而缩字号
  let fontPx = 28;
  let lines = layoutCaption(c.text, fontPx, maxW);
  while (fontPx > 24 && lines.length > 2) { fontPx -= 2; lines = layoutCaption(c.text, fontPx, maxW); }
  const lh = Math.round(fontPx * 1.42), padX = 32, padY = Math.round(fontPx * 0.60);
  const maxLineW = Math.max(...lines.map((ln) => ln.reduce((s, x) => s + x.w, 0)), 1);
  const bw = Math.min(1020, Math.max(340, maxLineW + padX * 2 + 20));
  const bh = lines.length * lh + padY * 2 - 8;
  const bx = (1080 - bw) / 2, by = CAPTION_TOP + slide;
  ctx.save();
  ctx.translate(540, by + bh / 2); ctx.scale(pop, pop); ctx.translate(-540, -(by + bh / 2));
  // 无底色，仅描边：文字直接压深色背景，靠描边 + 投影保证清晰
  ctx.strokeStyle = 'rgba(140,170,255,.55)'; ctx.lineWidth = 3;
  ctx.shadowColor = 'rgba(0,0,0,.55)'; ctx.shadowBlur = 18;
  ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 20); ctx.stroke();
  ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0;
  ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  lines.forEach((ln, li) => {
    let total = ln.reduce((s, x) => s + x.w, 0);
    let x = 540 - total / 2;
    const y = by + padY + li * lh + lh / 2 - 4;
    for (const sg of ln) {
      ctx.font = `900 ${fontPx}px ${SANS}`;
      ctx.shadowColor = 'rgba(0,0,0,.85)'; ctx.shadowBlur = 12; ctx.shadowOffsetY = 3;
      ctx.fillStyle = sg.kw ? '#8fb4ff' : '#f7f9ff';
      ctx.fillText(sg.t, x, y);
      ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
      x += sg.w;
    }
  });
  ctx.restore();
}

// ---------- 页面滚动 / 镜头 ----------
function scrollAt(t) {
  let y = 0;
  for (let i = 1; i < CH.length; i++) {
    const a = CH[i].t0 - 1.05, u = clamp((t - a) / 1.05);
    if (u > 0) y += E.inOutCubic(u) * SH;
    if (t > CH[i].t0) y += 0; // 到站后停留
  }
  // 每章内缓慢下移 26px，制造"有人正在读"的呼吸感
  for (let i = 0; i < CH.length; i++) {
    if (t >= CH[i].t0 && t < CH[i].t1) y += clamp((t - CH[i].t0) / (CH[i].t1 - CH[i].t0)) * 26;
  }
  return y;
}

    const tap1 = clamp((t - 14.53) / 0.6), done1 = clamp((t - 15.83) / 0.8);

    }

    cursor.style.opacity = vis;

    ctx.setTransform(K, 0, 0, K, 0, 0);

});
