const SPKS = Array.from(document.querySelectorAll('.spk'));
add(`<div style="text-align:center;font:900 64px ${SANS}" ><span class="grad" style="letter-spacing:6px">咱们下期，再见！</span></div>`,

// ---------- 字幕（顶部页眉位，与 v19 完全一致） ----------
const CAPTION_TOP = 240;   // 下移至抖音顶部搜索条/标签栏之下（状态栏 66 + 搜索栏 ~120 + 余量）
const KW = /(GEO|SEO|AI|DeepSeek)/g;
function segOf(text) {
  const segs = []; let last = 0; let m; KW.lastIndex = 0;
  while ((m = KW.exec(text))) { if (m.index > last) segs.push({ t: text.slice(last, m.index), kw: false }); segs.push({ t: m[0], kw: true }); last = m.index + m[0].length; }
  if (last < text.length) segs.push({ t: text.slice(last), kw: false });
  return segs;
}
function splitClauses(text) { return text.split(/(?<=[，。！？、；：…—])/).filter((s) => s.length); }
function layoutCaption(text, fontPx, maxW) {
  ctx.font = `900 ${fontPx}px ${SANS}`;
  const lines = []; let cur = []; let curW = 0;
  const newLine = () => { if (cur.length) lines.push(cur); cur = []; curW = 0; };
  const W = (s) => ctx.measureText(s).width;
  for (const clause of splitClauses(text)) {
    const segs = segOf(clause);
    const tw = segs.reduce((acc, sg) => acc + W(sg.t), 0);
    if (curW + tw <= maxW) { for (const sg of segs) { cur.push({ t: sg.t, kw: sg.kw, w: W(sg.t) }); curW += W(sg.t); } continue; }
    newLine();
    if (tw <= maxW) { for (const sg of segs) { cur.push({ t: sg.t, kw: sg.kw, w: W(sg.t) }); curW += W(sg.t); } continue; }
    for (const sg of segs) {
      if (sg.kw) {
        if (curW + W(sg.t) > maxW) newLine();
        cur.push({ t: sg.t, kw: true, w: W(sg.t) }); curW += W(sg.t); continue;
      }
      let s = sg.t;
      while (s.length) {
        let n = 0, wAcc = 0;
        while (n < s.length) { const cw = W(s[n]); if (curW + wAcc + cw > maxW && (cur.length || n > 0)) break; wAcc += cw; n++; }
        if (n === 0) { newLine(); continue; }
        cur.push({ t: s.slice(0, n), kw: false, w: wAcc }); curW += wAcc;
        s = s.slice(n);
        if (s.length) newLine();
      }
    }
  }
  if (cur.length) lines.push(cur);
  return lines;
}
function drawCaption(t) {
  let c = null;
  for (const k of window.CAPTIONS) { if (t >= k.s && t < k.e) { c = k; break; } }
  if (!c) return;
  const u = t - c.s;
  const pop = u < 0.18 ? lerp(1.06, 1, E.outQuad(u / 0.18)) : 1;
  const slide = u < 0.18 ? (1 - E.outQuad(u / 0.18)) * 22 : 0;
  const maxW = 840;
  let fontPx = 28;
  let lines = layoutCaption(c.text, fontPx, maxW);
  while (fontPx > 24 && lines.length > 2) { fontPx -= 2; lines = layoutCaption(c.text, fontPx, maxW); }
  const lh = Math.round(fontPx * 1.42), padX = 32, padY = Math.round(fontPx * 0.60);
  const maxLineW = Math.max(...lines.map((ln) => ln.reduce((s, x) => s + x.w, 0)), 1);
  const bw = Math.min(1020, Math.max(340, maxLineW + padX * 2 + 20));
  const bh = lines.length * lh + padY * 2 - 8;
  const bx = (1080 - bw) / 2, by = CAPTION_TOP + slide;
  ctx.save();
  ctx.translate(540, by + bh / 2); ctx.scale(pop, pop); ctx.translate(-540, -(by + bh / 2));
  ctx.strokeStyle = 'rgba(140,170,255,.55)'; ctx.lineWidth = 3;
  ctx.shadowColor = 'rgba(0,0,0,.55)'; ctx.shadowBlur = 18;
  ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 20); ctx.stroke();
  ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0;
  ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  lines.forEach((ln, li) => {
    let total = ln.reduce((s, x) => s + x.w, 0);
    let x = 540 - total / 2;
    const y = by + padY + li * lh + lh / 2 - 4;
    for (const sg of ln) {
      ctx.font = `900 ${fontPx}px ${SANS}`;
      ctx.shadowColor = 'rgba(0,0,0,.85)'; ctx.shadowBlur = 12; ctx.shadowOffsetY = 3;
      ctx.fillStyle = sg.kw ? '#8fb4ff' : '#f7f9ff';
      ctx.fillText(sg.t, x, y);
      ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
      x += sg.w;
    }
  });
  ctx.restore();
}

// ---------- 章节整屏上滑 ----------
function scrollAt(t) {
  let y = 0;
  for (let i = 1; i < CH.length; i++) {
    const a = CH[i].t0 - 1.05, u = clamp((t - a) / 1.05);
    if (u > 0) y += E.inOutCubic(u) * SH;
  }
  for (let i = 0; i < CH.length; i++) {
    if (t >= CH[i].t0 && t < CH[i].t1) y += clamp((t - CH[i].t0) / (CH[i].t1 - CH[i].t0)) * 30;
  }
  return y;
}

// 光标（仅订阅按钮）
function pagePos(el) { let x = 0, y = 0, n = el; while (n && n !== page) { x += n.offsetLeft; y += n.offsetTop; n = n.offsetParent; } return { x, y }; }
const cursor = document.createElement('div');
cursor.id = 'cursor';
cursor.innerHTML = `<svg width="52" height="52" viewBox="0 0 24 24"><path d="M4 2l15 9-7 1.6L8.8 20z" fill="#fff" stroke="#111" stroke-width="1.4" stroke-linejoin="round"/></svg>`;
cursor.style.cssText = 'position:absolute;width:52px;height:52px;z-index:400;left:0;top:0';
page.appendChild(cursor);
const CUR2 = (() => { const p = pagePos(subbtn); return { x: p.x + subbtn.offsetWidth * 0.5 - 10, y: p.y + subbtn.offsetHeight * 0.5 - 6 }; })();

function updateSub(t) {
  subWrap.style.opacity = clamp((t - 77.83) / 0.6);
  const su = t - 83.03;
  if (su < 0) {
    sublab.textContent = '＋ 关注';
    subbtn.style.background = '#fff'; subbtn.style.color = '#fe2c55';
    subbtn.style.border = '5px solid #fe2c55';
    subbtn.style.boxShadow = '0 20px 54px rgba(254,44,85,.25)';
    subbtn.style.transform = `scale(${1 + 0.025 * Math.sin(t * 3.4)})`;
    subring.style.opacity = 0;
    for (const sp of SPKS) sp.style.opacity = 0;
  } else {
    const bounce = 1 + 0.26 * Math.exp(-su * 5.5) * Math.cos(su * 16);
    sublab.textContent = '✓ 已订阅';
    subbtn.style.background = 'linear-gradient(135deg,#fe2c55,#ff6b81)';
    subbtn.style.color = '#fff';
    subbtn.style.border = '5px solid rgba(255,255,255,.55)';
    subbtn.style.boxShadow = `0 26px 70px rgba(254,44,85,${0.3 + 0.2 * clamp(su)})`;
    subbtn.style.transform = `scale(${bounce})`;
    const rp = clamp(su / 0.7);
    subring.style.opacity = (1 - rp) * 0.7;
    subring.style.transform = `scale(${1 + rp * 2.4})`;
    const bp = clamp((su - 0.12) / 1.0);
    const eo = 1 - Math.pow(1 - bp, 3);
    SPKS.forEach((sp, i) => {
      const a = (i / SPKS.length) * Math.PI * 2 + 0.35;
      const d = 30 + 170 * eo * (0.75 + 0.5 * (((i * 37) % 10) / 10));
      sp.style.opacity = bp > 0 && bp < 1 ? 1 - bp : 0;
      sp.style.transform = `translate(${Math.cos(a) * d}px, ${Math.sin(a) * d}px) scale(${1 - bp * 0.6})`;
    });
  }
}

Reel.scene({
  duration: 89.40, fps: 30,
  fonts: [`900 88px ${SANS}`, `900 40px ${SANS}`, `800 34px ${SANS}`, '900 210px "Microsoft YaHei"', '900 170px "Microsoft YaHei"'],
  setup() { },
  render(t) {
    page.style.transform = `translateY(${-scrollAt(t)}px)`;
    // 元素逐张浮出
    for (const o of ELS) {
      const u = t - o.t0;
      if (u < 0) { o.d.style.opacity = 0; continue; }
      const p = clamp(spring(u, { k: 150, c: 14 }));
      o.d.style.opacity = clamp(u / 0.12);
      o.d.style.transform = `translateY(${(1 - p) * o.dy}px) translateZ(${(o.z || 0) * p}px) scale(${lerp(o.sc ?? 0.94, 1, p)})`;
    }
    // 26.66s：对话卡淡出，GEO 大字卡在同一位置接管
    if (t > 26.4) chat2.style.opacity = 1 - clamp((t - 26.4) / 0.5);
    // 钩子：SEO 划掉动画（0.9s ~ 2.2s 画出删除线）
    const st = clamp((t - 0.9) / 1.3);
    document.getElementById('strike0').style.transform = `rotate(-7deg) scaleX(${E.outCubic(st)})`;
    // 78% 数字滚动 + 进度条生长
    const np = clamp((t - 61.0) / 5.2);
    document.getElementById('num4').textContent = Math.round(E.outCubic(np) * 78);
    document.getElementById('bar4').style.width = (E.outCubic(np) * 78) + '%';
    // GEO 大字呼吸光晕
    const geo = document.getElementById('geobig');
    if (geo) geo.style.filter = `drop-shadow(0 0 ${(18 + 16 * Math.sin(t * 2.2)).toFixed(1)}px rgba(122,92,255,${(0.35 + 0.2 * Math.sin(t * 2.2)).toFixed(2)}))`;
    // 背景光斑缓漂
    document.getElementById('glow1').style.transform = `translate(${Math.sin(t * 0.35) * 40}px, ${Math.cos(t * 0.28) * 30}px)`;
    document.getElementById('glow2').style.transform = `translate(${Math.cos(t * 0.3) * 36}px, ${Math.sin(t * 0.4) * 30}px)`;
    // 订阅光标
    const tap2 = clamp((t - 83.03) / 0.7), done2 = clamp((t - 86.23) / 0.8);
    const p2 = CUR2;
    const cxp = lerp(p2.x + 100, p2.x, tap2), cyp = lerp(p2.y + 140, p2.y, tap2);
    cursor.style.transform = `translate(${cxp}px, ${cyp}px) scale(${t > 83.13 && t < 83.93 ? 0.86 : 1})`;
    cursor.style.opacity = clamp((t - 81.03) / 0.5) * (1 - done2);
    updateSub(t);
    // HUD
    ctx.setTransform(K, 0, 0, K, 0, 0);
    ctx.clearRect(0, 0, 1080, 1920);
    drawCaption(t);
  },
});
