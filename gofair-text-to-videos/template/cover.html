<!doctype html>
<html lang="zh"><head><meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: #0a0f2c;
    position: relative;
  }
  /* 背景层次 */
  .bg-base { position: absolute; inset: 0;
    background: linear-gradient(160deg, #0a0f2c 0%, #131b45 45%, #1a1440 75%, #0d0a26 100%); }
  .glow1 { position: absolute; width: 900px; height: 900px; left: -260px; top: -180px; border-radius: 50%;
    background: radial-gradient(circle, rgba(79,124,255,.30), transparent 65%); }
  .glow2 { position: absolute; width: 820px; height: 820px; right: -220px; top: 560px; border-radius: 50%;
    background: radial-gradient(circle, rgba(138,92,255,.26), transparent 65%); }
  .glow3 { position: absolute; width: 700px; height: 700px; left: -140px; bottom: -160px; border-radius: 50%;
    background: radial-gradient(circle, rgba(254,44,85,.16), transparent 65%); }
  .grid { position: absolute; inset: 0;
    background-image: linear-gradient(rgba(120,150,255,.07) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(120,150,255,.07) 1px, transparent 1px);
    background-size: 90px 90px;
    -webkit-mask-image: radial-gradient(ellipse at 50% 38%, #000 30%, transparent 78%); }
  .ghost { position: absolute; right: -40px; bottom: 250px; font-size: 300px; font-weight: 900;
    color: rgba(99,120,220,.10); letter-spacing: 6px; font-style: italic; }

  .wrap { position: absolute; inset: 0; padding: 100px 84px; display: flex; flex-direction: column; }

  /* 顶部品牌 */
  .brand { display: flex; align-items: center; gap: 18px; }
  .brand .logo { width: 66px; height: 66px; border-radius: 18px;
    background: linear-gradient(135deg, #4f7cff, #8a5cff);
    color: #fff; font-weight: 900; font-size: 42px; line-height: 66px; text-align: center;
    box-shadow: 0 10px 30px rgba(79,124,255,.45); }
  .brand .name { font-size: 36px; font-weight: 800; color: rgba(255,255,255,.92); letter-spacing: 2px; }
  .brand .tagline { margin-left: auto; font-size: 26px; font-weight: 700; color: rgba(255,255,255,.60);
    border: 2px solid rgba(255,255,255,.22); border-radius: 999px; padding: 10px 26px; white-space: nowrap; }

  /* 大字标题区 */
  .title-zone { margin-top: 150px; }
  .seo-row { display: flex; align-items: center; gap: 28px; }
  .seo {
    position: relative; font-size: 218px; font-weight: 900; font-style: italic; letter-spacing: 2px;
    background: linear-gradient(100deg, #ff5f6d 10%, #fe2c55 55%, #b91d5e 90%);
    -webkit-background-clip: text; color: transparent;
    filter: drop-shadow(0 14px 44px rgba(254,44,85,.42));
    line-height: 1;
  }
  .seo .strike { position: absolute; left: 4px; right: 14px; top: 54%; height: 22px;
    background: linear-gradient(90deg, rgba(255,255,255,0), #ffffff 18%, #ffffff 82%, rgba(255,255,255,0));
    border-radius: 12px; transform: rotate(-7deg);
    box-shadow: 0 0 26px rgba(255,255,255,.65); }
  .qmark-big { font-size: 200px; font-weight: 900; color: #ffde4a; line-height: 1;
    filter: drop-shadow(0 12px 40px rgba(255,222,74,.4)); }
  .line2 { margin-top: 30px; font-size: 148px; font-weight: 900; color: #ffffff;
    letter-spacing: 2px; line-height: 1.12; white-space: nowrap;
    text-shadow: 0 10px 46px rgba(30,50,160,.55); }
  .line2 em { font-style: normal; color: #ffde4a; }

  /* 黄色胶囊 */
  .pill-row { margin-top: 72px; display: flex; align-items: center; gap: 26px; }
  .pill {
    background: linear-gradient(100deg, #ffe14d, #ffc61a);
    color: #1b1b1b; font-size: 76px; font-weight: 900; letter-spacing: 2px;
    padding: 30px 54px; border-radius: 999px;
    box-shadow: 0 18px 56px rgba(255,198,26,.4);
    border: 4px solid rgba(255,255,255,.55);
  }
  .pill b { color: #0a3fd6; }

  /* 副标题 */
  .sub { margin-top: 70px; font-size: 50px; font-weight: 700; color: rgba(210,220,255,.92);
    letter-spacing: 3px; white-space: nowrap; }
  .chips { margin-top: 56px; display: flex; gap: 20px; }
  .chip { font-size: 36px; font-weight: 800; color: rgba(220,230,255,.95); white-space: nowrap;
    border: 3px solid rgba(99,132,255,.55); border-radius: 999px; padding: 18px 30px;
    background: rgba(79,124,255,.12); box-shadow: 0 8px 30px rgba(79,124,255,.18); }
  .chip b { color: #ffde4a; }
  .sub span { color: #25f4ee; font-weight: 900; }

  /* 底部品牌条 */
  .bottom { margin-top: auto; display: flex; align-items: center; justify-content: center; }
  .footline { font-size: 34px; font-weight: 700; color: rgba(255,255,255,.80); letter-spacing: 2px;
    text-align: center; white-space: nowrap; text-shadow: 0 6px 24px rgba(20,35,110,.5); }
  .footline em { font-style: normal; color: #25f4ee; }
</style></head>
<body>
  <div class="bg-base"></div>
  <div class="glow1"></div><div class="glow2"></div><div class="glow3"></div>
  <div class="grid"></div>
  <div class="ghost">GEO</div>

  <div class="wrap">
    <div class="brand">
      <div class="logo">@</div>
      <div class="name">王经理讲GEO</div>
      <div class="tagline">专注 AI 与 GEO 技术研究</div>
    </div>

    <div class="title-zone">
      <div class="seo-row">
        <div class="seo">SEO<span class="strike"></span></div>
        <div class="qmark-big">？</div>
      </div>
      <div class="line2">要被<em>取代</em>了？</div>
      <div class="pill-row">
        <div class="pill">3分钟讲透 <b>GEO</b></div>
      </div>
      <div class="sub">客户不搜了，直接问 <span>AI</span></div>
      <div class="chips">
        <div class="chip"><b>①</b> 入口变了</div>
        <div class="chip"><b>②</b> 逻辑变了</div>
        <div class="chip"><b>③</b> 结果变了</div>
      </div>
    </div>

    <div class="bottom">
      <div class="footline">帮外贸和中小企业，在 <em>AI</em> 时代多拿客户、多接单。</div>
    </div>
  </div>
</body></html>
